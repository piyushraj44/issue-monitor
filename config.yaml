# Which public repositories to watch, as "owner/name".
# Add or remove lines here; the next run picks up the change.
# A repo you add later starts quietly: it records the newest issue
# and only alerts on issues opened after that.
repos:
  - ollama/ollama     # busy: usually several new issues a day
  - react/react       # quieter (formerly facebook/react)

# How many of the newest issues to fetch per repo on each run.
# If more than this many issues were opened between two runs,
# you get the newest ones plus a "there were more" note.
issues_per_repo: 20

# Issues that were opened AND closed before the monitor saw them
# (often spam or instant duplicates). false = skip them silently.
include_closed: false

# How many characters of the issue description to show in Telegram.
body_preview_chars: 300

# A short "still alive" message once a day, sent on the first run at or
# after `hour` in `timezone`. If it stops arriving, the monitor has stopped.
# timezone examples: UTC, Asia/Kolkata, Europe/London, America/New_York
heartbeat:
  enabled: true
  hour: 9
  timezone: UTC

# Phase 3: find similar issues in OTHER repos ("neighbours": popular repos
# sharing at least 2 GitHub topics with a watched repo, re-found weekly).
# Matches arrive as one digest message every 30 minutes, only when there are any.
discovery:
  enabled: true
  neighbors_per_repo: 8     # neighbour repos per watched repo
  min_stars: 50
  extra_repos: []           # always scan these too, e.g. [ggml-org/llama.cpp]
  exclude_repos: []         # never scan these
  possible: 0.15            # minimum score to be sent at all
  strong: 0.25              # score for a "Strong match" label
  max_per_digest: 5
